
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
